name: Bulk Resize Repository Images

on:
  push:
    branches:
      - main
    paths:
      - '0. RawImgs/**' # Triggers when new images are added here
  workflow_dispatch: # Allows you to manually click a button to run it anytime

jobs:
  resize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resize Images
        uses: petems/image-resizer-gh-action@master
        with:
          target: "0. RawImgs/" # Root folder reference
          dimensions: 50%
          widthLimit: 10000
          heightLimit: 10000

      # Moves resized items to the output folder cleanly
      - name: Move to Processed Folder
        run: |
          mkdir -p "1. ProcessedImgs"
          mv "0. RawImgs"/* "1. ProcessedImgs/" 2>/dev/null || true

      - name: Commit Processed Images
        uses: EndBug/add-and-commit@v9
        with:
          add: '.' # Commits all changes made inside the root workspace
          default_author: github_actions
          message: 'chore: automatically process repository images [skip ci]'
