name: Bulk Resize Repository Images

on:
  push:
    branches:
      - main
    # Paths filter removed to force a trigger on any push to main
  workflow_dispatch:

jobs:
  resize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process and Resize Images Natively
        run: |
          # 1. Enforce folder initialization natively
          mkdir -p "0. RawImgs"
          mkdir -p "1. ProcessedImgs"
          
          # 2. Check if there are any images to process
          if [ -z "$(ls -A "0. RawImgs")" ]; then
             echo "No images found in 0. RawImgs folder. Skipping process."
             exit 0
          fi

          # 3. Use ImageMagick to resize dynamically (freely scaling to 50%)
          echo "Resizing images..."
          mogrify -resize 50% "0. RawImgs"/*

          # 4. Move processed items to the output folder cleanly
          echo "Moving images to processed folder..."
          mv "0. RawImgs"/* "1. ProcessedImgs/"

      - name: Commit Processed Images
        uses: EndBug/add-and-commit@v9
        with:
          add: '.'
          default_author: github_actions
          message: 'chore: automatically process repository images [skip ci]'
